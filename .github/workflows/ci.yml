name: CI Pipeline

# MADR-0003 D1 (#134): single native per-PR quality gate - zero Docker,
# target wall-clock < 90 s. Runs on every PR and every push to dev/qa/main.
# Coverage (unchanged from the former 4-job pipeline): JSONC validation,
# install.sh syntax, agent/skill presence, native docs validators (links,
# MADR schema, mermaid syntax), diff-scoped secret scan, and the
# label-conditional architecture gate.
# Deep checks (full-history secret scan, Chromium render validation, image
# builds) moved to the scheduled deep-validation workflow (MADR-0003 D2-D4,
# #133) where their latency is irrelevant.

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read
  # gitleaks-action posts review comments on the PR when it detects a leak
  # (verified in gitleaks-action v3.0.0 src/gitleaks.js); nothing else needs
  # write access.
  pull-requests: write

jobs:
  quality-gate:
    name: Quality Gate (native, zero Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Bounded shallow fetch - deliberately NOT fetch-depth: 0 (MADR-0003
          # D1: no full-history checkout/scan in the per-PR path). The depth
          # must cover three consumers of this single checkout:
          #   1. gitleaks-action: on pull_request events it scans ONLY the
          #      PR's commits, running
          #        gitleaks detect --log-opts="--no-merges --first-parent
          #        <first-PR-commit>^..<last-PR-commit>"
          #      (verified in gitleaks-action v3.0.0 src/gitleaks.js); on push
          #      events it scans only the pushed commits
          #      (<first-pushed>^..<last-pushed>). Those commit objects must
          #      exist locally for the git log range to resolve - depth 60
          #      covers PR/push chains up to ~58 commits (this repo's PRs
          #      carry 1-3 commits; a chain beyond the bound fails loudly,
          #      never silently).
          #   2. architecture gate: diffs
          #      github.event.pull_request.base.sha..GITHUB_SHA; the base tip
          #      is the merge ref's first parent (1 hop).
          #   3. the validation steps: check out the PR merge ref (standard
          #      pull_request semantics).
          # Full-history scanning never happens on PR/push events with this
          # action regardless of checkout depth; the scan range is always
          # bound to the event's commits.
          fetch-depth: 60

      - name: Validate opencode.jsonc (JSONC with comment stripping)
        run: |
          python3 -c "
          import json, sys
          def strip_jsonc(text):
              result = []
              i = 0
              in_string = False
              escape = False
              while i < len(text):
                  c = text[i]
                  if in_string:
                      result.append(c)
                      if escape:
                          escape = False
                      elif c == '\\\\':
                          escape = True
                      elif c == '\"':
                          in_string = False
                  else:
                      if c == '\"':
                          in_string = True
                          result.append(c)
                      elif c == '/' and i + 1 < len(text) and text[i+1] == '/':
                          while i < len(text) and text[i] != '\n':
                              i += 1
                          continue
                      else:
                          result.append(c)
                  i += 1
              return ''.join(result)
          with open('opencode.jsonc') as f:
              content = f.read()
          try:
              json.loads(strip_jsonc(content))
              print('opencode.jsonc is valid JSONC')
          except json.JSONDecodeError as e:
              print(f'Invalid JSONC: {e}', file=sys.stderr)
              sys.exit(1)
          "
      - name: Check install.sh syntax
        run: bash -n install.sh
      - name: Verify all agent files exist
        run: |
          for agent in architect coach code-reviewer cyber-security developer devops scrum-master; do
            test -f "agents/$agent.md" || { echo "Missing agents/$agent.md"; exit 1; }
          done
      - name: Verify all skill directories exist
        run: |
          for skill in arc42-documentation coach docker-expert fastmcp-builder find-skills github-scrum-board harness-engineering home-governance madr-adr mermaid-diagrams opentofu-iac release-automation test-driven-development; do
            test -f "skills/$skill/SKILL.md" || { echo "Missing skills/$skill/SKILL.md"; exit 1; }
          done

      - name: Docs validation (links, MADR, mermaid syntax - native, no Docker)
        run: |
          python3 harness/docs-validation/check_links.py .
          python3 harness/docs-validation/check_madr.py .
          # --syntax: native structural mermaid validation (MADR-0003 D1);
          # render-level validation stays in the deep-validation workflow
          # (MADR-0003 D2, #133).
          python3 harness/docs-validation/check_mermaid.py --syntax .

      - name: Scan for secrets (gitleaks, diff-scoped)
        # Pinned to the v3.0.0 commit SHA (no @master/@main; v2 is Node 20 and
        # dead on hosted runners since 2026-09-16). Scan scope by event type
        # (verified in v3.0.0 src/gitleaks.js):
        #   - pull_request: ONLY the PR's commits
        #     (--log-opts="--no-merges --first-parent <first-PR-commit>^..<last-PR-commit>")
        #   - push: ONLY the pushed commits
        #     (<first-pushed>^..<last-pushed>)
        # Full-history scans are out of scope here by design; they belong to
        # the deep-validation workflow (MADR-0003 D2, #133). GITHUB_TOKEN is
        # required for PR scans and is used to post review comments on
        # detected leaks. No GITLEAKS_LICENSE needed (personal account).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanned binary to the version this action release defaults
          # to, making the toolchain explicit and auditable.
          GITLEAKS_VERSION: "8.24.3"
          # Lean gate: no SARIF artifact upload on every run (leaks still fail
          # the job, post a PR review comment and appear in the job summary).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Enforce architecture coverage for requires-architecture PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_FILE: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if ! jq -e 'any(.pull_request.labels[]?; .name == "requires-architecture")' "$EVENT_FILE" >/dev/null; then
            echo "NOTE: PR does not carry the 'requires-architecture' label - architecture gate passes trivially."
            exit 0
          fi
          echo "PR carries 'requires-architecture': the diff must touch docs/adr/** or docs/architecture/arc42/**."
          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(docs/adr/|docs/architecture/arc42/)'; then
            echo "PASS: architecture documentation updated (docs/adr/** or docs/architecture/arc42/**)."
            exit 0
          fi
          echo "::error::PR labeled 'requires-architecture' but the diff contains no changes under docs/adr/** or docs/architecture/arc42/**. Label semantics: apply 'requires-architecture' to PRs that change architecture-relevant behaviour; the two accepted paths to satisfy this gate are (1) a new or updated ADR under docs/adr/** (MADR schema) or (2) an arc42 documentation update under docs/architecture/arc42/**. Add the corresponding changes or remove the label."
          exit 1
