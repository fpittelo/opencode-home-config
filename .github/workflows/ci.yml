name: CI Pipeline

# MADR-0003 D1 (#134): single native per-PR quality gate - zero Docker,
# target wall-clock < 90 s. Runs on every PR targeting main and every push
# to main (trunk+tag delivery, MADR-0017).
# All config gates are delegated to harness/run-config-gate.sh (#366) -
# the single source of truth shared with the local pre-flight gate: JSONC
# validation, install.sh syntax, agent/skill presence, namespace-exclusivity
# permission invariant (#150 COACH_*, #207 BROWSER_*), native docs
# validators (links, MADR schema, mermaid syntax) and their regression
# suites. Only genuinely CI-only steps remain inline: the diff-scoped
# secret scan and the path-derived self-triggering architecture-coverage
# gate (#421 — thin invocation of harness/check_arch_coverage.sh, logic
# pinned by gate 21).
# Deep checks (full-history secret scan, Chromium render validation, image
# builds) moved to the scheduled deep-validation workflow (MADR-0003 D2-D4,
# #133) where their latency is irrelevant.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action posts review comments on the PR when it detects a leak
  # (verified in gitleaks-action v3.0.0 src/gitleaks.js); nothing else needs
  # write access.
  pull-requests: write

jobs:
  quality-gate:
    name: Quality Gate (native, zero Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Bounded shallow fetch - deliberately NOT fetch-depth: 0 (MADR-0003
          # D1: no full-history checkout/scan in the per-PR path). The depth
          # must cover three consumers of this single checkout:
          #   1. gitleaks-action: on pull_request events it scans ONLY the
          #      PR's commits, running
          #        gitleaks detect --log-opts="--no-merges --first-parent
          #        <first-PR-commit>^..<last-PR-commit>"
          #      (verified in gitleaks-action v3.0.0 src/gitleaks.js); on push
          #      events it scans only the pushed commits
          #      (<first-pushed>^..<last-pushed>). Those commit objects must
          #      exist locally for the git log range to resolve - depth 60
          #      covers PR/push chains up to ~58 commits (this repo's PRs
          #      carry 1-3 commits; a chain beyond the bound fails loudly,
          #      never silently).
          #   2. architecture gate: diffs
          #      github.event.pull_request.base.sha..GITHUB_SHA; the base tip
          #      is the merge ref's first parent (1 hop).
          #   3. the config gate script (harness/run-config-gate.sh):
          #      operates on the checked-out PR merge ref (standard
          #      pull_request semantics).
          # Full-history scanning never happens on PR/push events with this
          # action regardless of checkout depth; the scan range is always
          # bound to the event's commits.
          fetch-depth: 60

      - name: Run config gate (harness/run-config-gate.sh)
        # Single source of truth for all config gates (#366): the exact script
        # that runs as the local pre-flight gate. The script is stdlib-only
        # (python3 + bash, both preinstalled on ubuntu-latest), resolves all
        # paths relative to the repository root (its default REPO_ROOT), and
        # exits non-zero on the first failing gate - which fails this job.
        run: bash harness/run-config-gate.sh

      - name: Scan for secrets (gitleaks, diff-scoped)
        # Pinned to the v3.0.0 commit SHA (no @master/@main; v2 is Node 20 and
        # dead on hosted runners since 2026-09-16). Scan scope by event type
        # (verified in v3.0.0 src/gitleaks.js):
        #   - pull_request: ONLY the PR's commits
        #     (--log-opts="--no-merges --first-parent <first-PR-commit>^..<last-PR-commit>")
        #   - push: ONLY the pushed commits
        #     (<first-pushed>^..<last-pushed>)
        # Full-history scans are out of scope here by design; they belong to
        # the deep-validation workflow (MADR-0003 D2, #133). GITHUB_TOKEN is
        # required for PR scans and is used to post review comments on
        # detected leaks. No GITLEAKS_LICENSE needed (personal account).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanned binary to the version this action release defaults
          # to, making the toolchain explicit and auditable.
          GITLEAKS_VERSION: "8.24.3"
          # Lean gate: no SARIF artifact upload on every run (leaks still fail
          # the job, post a PR review comment and appear in the job summary).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Enforce architecture coverage for architecture-relevant paths
        # #421: PATH-DERIVED and SELF-TRIGGERING — no human label application
        # is required (the label variant passed trivially for every agent PR:
        # no MCP tool labels PRs, `gh api *` is root-denied for every agent,
        # and `gh pr edit` is broken for label writes #304). Any diff touching
        # agents/**, opencode.jsonc, .github/workflows/**, harness/** or
        # skills/** must also touch docs/adr/** or docs/architecture/arc42/**,
        # or this job fails. install.sh is deliberately EXCLUDED from the
        # trigger set: a mechanical pin bump (e.g. #447, herdr digest
        # refresh) changes supply-chain material, not architecture-relevant
        # behaviour — forcing an ADR per pin would spam the MADR index. The
        # requires-architecture LABEL remains advisory-only: reviewers may
        # set it as a hint, the gate never reads it (AC4). API-free: the
        # label read (and its #287 live-read lesson) is gone entirely; the
        # gate is read-only over the local diff.
        # Diff mechanics: BASE_SHA = the event's base tip = the merge ref's
        # first parent (1 hop, covered by the depth-60 checkout above), the
        # exact mechanics the previous gate used for its diff — only the
        # trigger source changed. The logic lives in
        # harness/check_arch_coverage.sh so the landed gate is testable
        # as-is (gate 21 pins the trigger/doc sets and the failure shapes).
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash harness/check_arch_coverage.sh "$BASE_SHA" "$HEAD_SHA"
