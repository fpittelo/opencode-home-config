name: Deep Validation

# MADR-0003 D2/D3 (#133): deep checks on a deep cadence. Docker IS allowed
# here - latency is irrelevant on this cadence. This workflow never gates
# PRs and must NOT be added to branch-protection required checks.
#
# Triggers:
#   - weekly cron (Mondays 05:00 UTC): bounds worst-case detection latency
#     on main for defects the fast per-PR path cannot see (render-level
#     Mermaid failures, pre-existing secrets).
#   - push to main (= every trunk merge): nothing reaches production
#     without full-history secret scanning and render-level Mermaid
#     validation.
#   - push of a release tag v* (= every tag-from-trunk release, MADR-0017):
#     the same full-history scan and render validation run at release time.
#   - workflow_dispatch: manual on-demand deep checks.
#
# Image-build verification (#375): the image-build-verification job runs only
# on cron/workflow_dispatch. On push/tag events harness-image-build.yml already
# builds all three images, so building them here too duplicated every trunk
# push (6 builds -> 3).
#
# Run-record integrity (#449 AC2b): two mechanisms make the DV signal
# deletion-evident, closing the #448 mechanism (run records #76-#90 deleted
# while sibling workflows stayed contiguous - red-gate evidence silently
# removed). (1) run-record-census lists this workflow's own run numbers and
# detects holes - run numbers are allocated at creation and never re-used, so
# a missing number is a created-then-deleted record; detected holes are a
# non-failing signal (::warning:: + summary). (2) record-run-status posts a
# LEGACY COMMIT STATUS on the head sha - statuses live outside the deletable
# run records, so a deleted run leaves its status behind and the deletion is
# evident. Neither is a branch-protection required check (signal, not gate).

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Least privilege: every job only reads the repository. No GHCR push
  # (image builds here are build-only verification; publishing stays in
  # harness-image-build.yml), no PR review comments (this workflow never
  # runs on pull_request events).
  contents: read

jobs:
  secret-scan-full-history:
    name: Secret Scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan full git history (gitleaks v8.24.3, digest-pinned image)
        # Why not gitleaks-action? Verified in gitleaks-action v3.0.0
        # (src/index.js + src/gitleaks.js @ e0c47f4f): the action appends a
        # --log-opts commit range for push and pull_request events and only
        # omits it (full-history scan) for schedule/workflow_dispatch. On
        # the push-to-main and release-tag triggers it would therefore scan
        # ONLY the pushed commits - not full history. To get identical
        # full-history semantics on ALL triggers, the
        # version-pinned gitleaks binary is invoked directly. The image is
        # digest-pinned (tag alone is mutable - #142 A5): the digest is the
        # OCI image index (multi-arch manifest list) of zricethezav/gitleaks
        # v8.24.3, resolved via the Docker Hub v2 API
        # (hub.docker.com/v2/repositories/zricethezav/gitleaks/tags/v8.24.3).
        # With no --log-opts, gitleaks detect scans every commit
        # reachable from HEAD. --redact keeps secret values out of the job
        # log while file/line/rule stay visible for triage.
        run: |
          docker run --rm \
            --network=none \
            -v "$PWD:/src:ro" \
            -w /src \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source /src --verbose --redact

  docs-render-validation:
    name: Docs Render Validation (mermaid render, links, MADR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull published docs-validator image (digest-pinned, build fallback)
        # #375: digest-pinned (tag alone is mutable - #142 A5). On push/tag
        # events harness-image-build.yml republishes :latest concurrently, so
        # pulling :latest here raced the publish (nondeterministic). The digest
        # is the OCI image index of the docs-validator; refresh it when the
        # validator image changes (harness/README.md §4). If the digest is not
        # available, the build fallback builds from the checked-out commit
        # (also deterministic).
        run: |
          IMAGE=ghcr.io/fpittelo/harness-docs-validator
          DIGEST=sha256:92770b9c4df72106912c195cb230ee66bb4267a5aa607b8d77cfdc981c3074ca
          docker pull "${IMAGE}@${DIGEST}" \
            && docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest" \
            || docker build -f harness/docker/Dockerfile.docs-validator -t "${IMAGE}:latest" harness/docker

      - name: Run docs validation in hardened container
        # Identical invocation to the former per-PR docs-quality-gate job
        # (removed by MADR-0003 D1/#134): read-only rootfs, non-root UID
        # 1000, no capabilities, no network, resource caps. Runs
        # run_docs_validation.sh, which exercises the RENDER mode of
        # check_mermaid.py (default mode, unchanged by #134) plus the link
        # and MADR validators.
        run: |
          docker run --rm \
            --read-only \
            --user 1000:1000 \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --network=none \
            --memory=4g --memory-swap=4g \
            --cpus=2.0 \
            --tmpfs /tmp:noexec,nosuid,size=1g \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            ghcr.io/fpittelo/harness-docs-validator:latest \
            bash harness/docs-validation/run_docs_validation.sh /workspace

  image-build-verification:
    name: Verify Harness Image Build (${{ matrix.name }})
    # #375: build verification is redundant on push/tag events, where
    # harness-image-build.yml already builds all three images. Keep it on the
    # deep cadence (cron) and manual dispatch only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-runner
            dockerfile: Dockerfile.python
          - name: rust-runner
            dockerfile: Dockerfile.rust
          - name: docs-validator
            dockerfile: Dockerfile.docs-validator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verification only, no push)
        # Build-only: proves the harness images still build. Publishing is
        # owned by harness-image-build.yml (workflow_dispatch / harness-v*
        # tags, MADR-0003 D4).
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-record-census:
    name: Census DV run numbers (deletion-evident hole check)
    # #449 AC2b (option B, zero write permissions): run numbers are allocated
    # at run creation and never re-used, so a gap in this workflow's own
    # numbering is a created-then-deleted record (the #448 mechanism). The
    # census re-runs on every DV execution, so deletion is detected on the
    # next run even though the deleted records themselves are gone. Holes
    # are a SIGNAL: ::warning:: + summary, never a build breaker (a red
    # census would be indistinguishable from the gate failing and would
    # break the trunk over infrastructure noise). actions: read is the
    # least privilege needed to list this workflow's own runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Detect run-number holes in this workflow's record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deep-validation.yml" --jq '.id' 2>/dev/null || true)"
          numbers="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" --jq '.workflow_runs[].run_number' 2>/dev/null | sort -n || true)"
          if [ -z "$numbers" ]; then
            echo "::warning::DV run-number census inconclusive: the workflow's run records could not be listed (API/auth/network) — silence here is NOT a verified-contiguous record (C11 class, #449)"
            {
              echo "### DV run-number census: inconclusive"
              echo ""
              echo "The workflow's run records could not be listed this run; hole detection did not execute. The deletion-evident integrity check is degraded — investigate the API failure (#449)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          holes="$(printf '%s\n' "$numbers" | awk 'NR==1{prev=$1;next}{if($1>prev+1)for(i=prev+1;i<$1;i++)printf "%s ",i;prev=$1}END{}')"
          if [ -n "$holes" ]; then
            echo "::warning::DV run-record holes detected: run numbers [${holes% }] missing — numbers are allocated at creation and never re-used, so these are created-then-deleted records (the #449 mechanism; investigate who/what, the API cannot attribute deletions on personal repos)"
            {
              echo "### DV run-number census: HOLES DETECTED"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Missing run numbers | ${holes% } |"
              echo ""
              echo "Run numbers are allocated sequentially at creation and never re-used; every missing number is a run whose record was deleted after creation. Deletion attribution is not available via the API on personal repos — record the holes and investigate via the account Security log."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### DV run-number census: contiguous"
              echo ""
              echo "Run numbers present up to $(printf '%s' "$numbers" | tail -1) with no gaps — no deleted-record holes detected this run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  record-run-status:
    name: Record DV verdict as a durable commit status
    # #449 AC2b (option A): a legacy commit status on the head sha lives
    # OUTSIDE the deletable run records (statuses are keyed by sha + context,
    # not part of the run record) — if the runs vanish, the status remains
    # and the deletion is evident. Permission tradeoff, evaluated against
    # MADR-0026-style least privilege: statuses: write lets this workflow
    # post a status on any sha in-repo; the principal able to delete runs
    # can already edit this workflow file, so the marginal forgery risk sits
    # inside the existing trust boundary and is accepted for the durable
    # record (#449). Signal, not gate: never a branch-protection required
    # check.
    needs: [secret-scan-full-history, docs-render-validation, image-build-verification]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Post the commit status (durable, deletion-evident)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_RESULT: ${{ needs.secret-scan-full-history.result }}
          RENDER_RESULT: ${{ needs.docs-render-validation.result }}
          IMAGE_RESULT: ${{ needs.image-build-verification.result }}
        run: |
          # Overall DV verdict: failure if any DV job failed or was
          # cancelled; skipped jobs (image-build-verification on push/tag
          # events) do not fail the verdict.
          overall="success"
          for result in "$SCAN_RESULT" "$RENDER_RESULT" "$IMAGE_RESULT"; do
            case "$result" in
              failure | cancelled) overall="failure" ;;
            esac
          done
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$overall" \
            -f context="deep-validation" \
            -f description="deep-validation ${overall} (run ${GITHUB_RUN_ID})" \
            -f target_url="$RUN_URL" >/dev/null 2>&1; then
            echo "durable commit status posted: deep-validation=$overall on ${SHA} (survives run deletion, #449)"
          else
            echo "::warning::could not post the deep-validation commit status — the durable deletion-evident record is MISSING for this run; investigate the API failure (C11 class, #449)"
          fi
          exit 0
