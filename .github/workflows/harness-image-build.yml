name: Harness Runner Image Build

# MADR-0003 D4 (#133) + MADR-0017 (trunk+tag): runner images serve other
# repositories and change rarely, so they are NOT rebuilt on every
# harness/docker/** push. Triggers:
#   - workflow_dispatch: manual rebuild of the selected ref's images.
#   - push to main (the trunk): publishes :latest.
#   - push of a release tag v* (e.g. v1.28.0): publishes :vX.Y.Z.
#   - pull_request touching harness/docker/**: build-only verification
#     (never pushed).
# Build-only verification of these images also lives in deep-validation.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'harness/docker/**'
      - '.github/workflows/harness-image-build.yml'

env:
  REGISTRY: ghcr.io
  PYTHON_IMAGE: ghcr.io/fpittelo/harness-runner-python
  RUST_IMAGE: ghcr.io/fpittelo/harness-runner-rust
  DOCS_VALIDATOR_IMAGE: ghcr.io/fpittelo/harness-docs-validator

permissions:
  contents: read
  packages: write

jobs:
  build-python:
    name: Build Python Harness Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PYTHON_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Python runner
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/Dockerfile.python
          # Verify-only on pull_request, publish otherwise (#142 A6
          # revisited: the condition is live again now that this workflow
          # also triggers on pull_request for harness/docker/** changes).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-rust:
    name: Build Rust Harness Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUST_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Rust runner
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/Dockerfile.rust
          push: ${{ github.event_name != 'pull_request' }} # verify-only on PR, see build-python
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docs-validator:
    name: Build Docs Validator Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCS_VALIDATOR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push docs validator
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/Dockerfile.docs-validator
          push: ${{ github.event_name != 'pull_request' }} # verify-only on PR, see build-python
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
