name: Harness Runner Image Build

on:
  push:
    branches: [dev, qa, main]
    paths:
      - 'harness/docker/**'
      - '.github/workflows/harness-image-build.yml'
  pull_request:
    branches: [dev, qa, main]
    paths:
      - 'harness/docker/**'
      - '.github/workflows/harness-image-build.yml'

env:
  REGISTRY: ghcr.io
  PYTHON_IMAGE: ghcr.io/fpittelo/harness-runner-python
  RUST_IMAGE: ghcr.io/fpittelo/harness-runner-rust

permissions:
  contents: read
  packages: write

jobs:
  build-python:
    name: Build Python Harness Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PYTHON_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Python runner
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/Dockerfile.python
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-rust:
    name: Build Rust Harness Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUST_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Rust runner
        uses: docker/build-push-action@v6
        with:
          context: ./harness/docker
          file: ./harness/docker/Dockerfile.rust
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
