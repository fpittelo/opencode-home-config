# mypy configuration for the generic Python gate (harness/run.sh python).
#
# This repository is a configuration repo with no pyproject.toml (run.sh
# SKIPs its deps phase by design — see harness/README.md §8), so third-party
# packages used by skill reference scripts cannot be declared as repo
# dependencies. The scripts under skills/fastmcp-builder/scripts/ are
# skill teaching content executed only inside a user's own MCP project
# (where `mcp` and `anthropic` are installed); they are type-checked here
# for annotation hygiene, with their absent third-party imports resolved
# as Any via ignore_missing_imports (never silently for first-party code).
[mypy]

[mypy-mcp.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True
